<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>杭电GPA计算器</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,sans-serif}
body{padding:20px;max-width:700px;margin:0 auto;background:#f7f8fa;color:#222}
h1{text-align:center;margin-bottom:20px;font-size:22px}
.card{background:#fff;border-radius:12px;padding:16px;box-shadow:0 2px 8px #00000010;margin-bottom:16px}
.row{display:flex;gap:10px;align-items:center;margin-bottom:10px}
input,select{flex:1;padding:10px;border:1px solid #ddd;border-radius:8px;font-size:16px}
button{padding:10px 14px;border:none;border-radius:8px;background:#2563eb;color:#fff;font-size:15px;cursor:pointer}
button.del{background:#ef4444}
.btns{display:flex;gap:10px;margin:12px 0}
.result{font-size:20px;font-weight:bold;color:#2563eb;margin-top:10px}
</style>
</head>
<body>
<h1>杭电GPA计算器（5分制）</h1>
<div class="card">
  <div id="list"></div>
  <div class="btns">
    <button onclick="addRow()">添加课程</button>
    <button onclick="calc()">计算GPA</button>
    <button class="del" onclick="clearAll()">清空</button>
  </div>
  <div class="result">GPA：--</div>
</div>
<script>
const scoreMap = {
  '优秀':4.5,'良好':3.5,'中等':2.5,'及格':1.5,'不及格':0,
  '90-100':4.5,'85-89':4.0,'82-84':3.7,'78-81':3.3,'75-77':3.0,
  '72-74':2.7,'68-71':2.3,'64-67':2.0,'60-63':1.5,'<60':0
}
function addRow(){
  const div=document.createElement('div');div.className='row'
  div.innerHTML=`
    <input placeholder="课程名">
    <input type="number" placeholder="学分" step="0.5">
    <select>
      <option value="">选择成绩</option>
      <option>优秀</option><option>良好</option><option>中等</option><option>及格</option><option>不及格</option>
      <option>90-100</option><option>85-89</option><option>82-84</option><option>78-81</option>
      <option>75-77</option><option>72-74</option><option>68-71</option><option>64-67</option><option>60-63</option><option>&lt;60</option>
    </select>
    <button class="del" onclick="this.parentElement.remove()">删除</button>
  `
  document.getElementById('list').appendChild(div)
}
function calc(){
  const rows=document.querySelectorAll('.row');
  let sumCredit=0,sumPoint=0
  for(let r of rows){
    const credit=Number(r.children[1].value)
    const grade=r.children[2].value
    if(!credit||!grade)continue
    const p=scoreMap[grade]
    sumCredit+=credit
    sumPoint+=credit*p
  }
  const gpa=sumCredit?(sumPoint/sumCredit).toFixed(3):'--'
  document.querySelector('.result').innerText='GPA：'+gpa
}
function clearAll(){document.getElementById('list').innerHTML='';document.querySelector('.result').innerText='GPA：--'}
addRow()
</script>
</body>
</html>
